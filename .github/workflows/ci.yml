name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      # The ONLY typechecker in the pipeline: ESLint is type-aware but does not
      # report assignability errors, and `astro build` does not typecheck at all.
      # Without this step the declared wire contract (src/lib/api/contract.ts plus
      # the explicitly parameterized `jsonResponse<T>`) gates nothing.
      - run: npm run typecheck
      # Unit suite is DB-free, so it needs no services and runs before the build.
      - run: npm test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  # DB-backed suite: real HTTP through `astro dev` against an EPHEMERAL local
  # Supabase stack booted here — never the cloud project the build step targets.
  # Separate job so it runs in parallel with lint/build and fails attributably.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      # `start` applies supabase/migrations, so RLS is live for the suite.
      - name: Start local Supabase
        run: npx supabase start
      # Keys come from the running stack, NOT from repo secrets — the
      # service-role key is ephemeral and dies with the job. `-o env` emits
      # NAME="value": grep drops CLI warnings, sed strips the quotes.
      - name: Export local Supabase env
        run: |
          npx supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(SUPABASE_URL|SUPABASE_KEY|SUPABASE_SERVICE_ROLE_KEY)=' \
            | sed -E 's/^([A-Z_]+)="?([^"]*)"?$/\1=\2/' >> "$GITHUB_ENV"
      - run: npm run test:integration
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop

  # Browser-E2E suite: the comparer's failure surfacing (test-plan §3 Phase 4, risks
  # #7 and #8) and the path builder's stale-response ordering (§3 Phase 5, risk #9).
  # Third sibling job so a red spec is attributable on sight.
  #
  # Supabase IS booted here, and that is a Phase 5 reversal. Phase 4 ran this job
  # without a stack on the grounds that the comparer mounts at `/` and needs no
  # session — true for the comparer, false for the path builder, which sits behind the
  # middleware session gate and is simply unreachable without keys. So the same
  # EPHEMERAL local stack the `integration` job boots is booted here too (~90s), and
  # the suite signs one owner in through the app's own route before the specs run.
  # The comparer specs are unaffected: they scope to the `<main>` landmark, so the
  # config-error banner that keys now suppress was never in their DOM anyway.
  #
  # The job id is `e2e` with no `name:`, matching `ci` and `integration`, so the
  # reported check context is literally `e2e` — the string that goes in main's
  # required-check list.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      # Chromium only — these are failure-surfacing tests, not cross-browser
      # rendering tests. `--with-deps` installs the OS libraries, which live outside
      # ~/.cache/ms-playwright and are why caching the browser is not worth it here.
      - run: npx playwright install --with-deps chromium
      # `start` applies supabase/migrations, so RLS is live for the suite.
      - name: Start local Supabase
        run: npx supabase start
      # Keys come from the running stack, NOT from repo secrets — the
      # service-role key is ephemeral and dies with the job. `-o env` emits
      # NAME="value": grep drops CLI warnings, sed strips the quotes.
      - name: Export local Supabase env
        run: |
          npx supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(SUPABASE_URL|SUPABASE_KEY|SUPABASE_SERVICE_ROLE_KEY)=' \
            | sed -E 's/^([A-Z_]+)="?([^"]*)"?$/\1=\2/' >> "$GITHUB_ENV"
      # `playwright.config.ts` owns the dev server (webServer), the port, testDir and
      # the setup project — nothing to wire here. It also blanks the service-role key
      # out of the dev server's env; the test process keeps it for owner teardown.
      - run: npm run test:e2e
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
